<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 60px; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  .caja { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 8px 0 4px; }

           font-size: 24px; font-weight: 700; padding: 22px 18px; box-shadow: 0 6px 18px rgba(31,122,77,.28); }
  .boton:active { transform: scale(.98); }
  .boton[disabled] { background: #8fb9a3; box-shadow: none; cursor: default; }
  .estado { margin: 14px 0 6px; min-height: 28px; font-size: 18px; font-weight: 600; color: #1f7a4d; }
  .barra { height: 14px; background: #e7dfd5; border-radius: 8px; overflow: hidden; margin-bottom: 26px; }
  .barra > div { height: 100%; width: 0; background: #1f7a4d; transition: width .3s; }
  .ayuda { background: #fff4d6; border: 1px solid #f0d9a0; border-radius: 12px; padding: 12px 14px; font-size: 16px; margin-bottom: 26px; }
  h2 { font-size: 20px; color: #6b625a; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 12px 12px 12px 16px;
       margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  li .n { flex: 1; font-size: 17px; word-break: break-word; }
  li button, li a { flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0; display: inline-flex;
                    align-items: center; justify-content: center; font-size: 20px; cursor: pointer; text-decoration: none; }
  li button { background: #efe7dc; color: #2b2622; }
  li a { background: #1f7a4d; color: #fff; }
  li.sonando { outline: 3px solid #1f7a4d; }
  audio { width: 100%; margin-top: 8px; }
  .pie { text-align: center; color: #9a908a; font-size: 14px; margin-top: 30px; }
</style>
</head>
<body>

  <button class="boton" id="btnTodo" onclick="descargarTodo()">⬇️ Descargar TODAS las canciones</button>
  <div class="estado" id="estado"></div>
  <div class="barra"><div id="progreso"></div></div>

  <div class="ayuda">
    <b>Si el celular pregunta "¿Descargar varios archivos?"</b> toca <b>PERMITIR</b>.<br>
    Las canciones quedan en la carpeta <b>Descargas</b> del celular.
  </div>

  <h2>O escuchar / bajar una por una</h2>
  <ul id="lista"></ul>
  <audio id="player" controls preload="none"></audio>
  <p class="pie">Hecha con cariño para escuchar sin complicaciones.</p>
</div>

const lista = document.getElementById("lista");
const player = document.getElementById("player");
const estado = document.getElementById("estado");
const progreso = document.getElementById("progreso");
const btnTodo = document.getElementById("btnTodo");

canciones.forEach((c, i) => {
  const li = document.createElement("li");
  li.id = "c" + i;
  li.innerHTML =
    `<span class="n">${c.nombre}</span>` +
    `<button title="Escuchar" onclick="reproducir(${i})">▶️</button>` +
    `<a title="Descargar" href="${c.url}" download="${c.archivo}">⬇️</a>`;
  lista.appendChild(li);
});

function reproducir(i) {
  document.querySelectorAll("li.sonando").forEach(el => el.classList.remove("sonando"));
  document.getElementById("c" + i).classList.add("sonando");
  player.src = canciones[i].url;
  player.play();
  player.onended = () => { if (i + 1 < canciones.length) reproducir(i + 1); };
}

function bajar(c) {
  const a = document.createElement("a");
  a.href = c.url;
  a.download = c.archivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function descargarTodo() {
  btnTodo.disabled = true;
  for (let i = 0; i < canciones.length; i++) {
    estado.textContent = `Descargando ${i + 1} de ${canciones.length}: ${canciones[i].nombre}`;
    progreso.style.width = ((i + 1) / canciones.length * 100) + "%";
    bajar(canciones[i]);
    await new Promise(r => setTimeout(r, 1500));   // pausa para que el celular no se sature
  }
  estado.textContent = `✅ Listo. Las ${canciones.length} canciones están en Descargas.`;
  btnTodo.textContent = "Descargar de nuevo";
  btnTodo.disabled = false;
}
</script>
</body>
</html>
